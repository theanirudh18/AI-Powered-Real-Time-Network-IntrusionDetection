<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>

        Real-Time Detection

    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark">

    <div class="container">

        <a class="navbar-brand fw-bold" href="/">

            <i class="fas fa-shield-alt"></i>

            AI-RealTime-IDS

        </a>

    </div>

</nav>

<div class="container mt-5">

    <h1 class="text-center">

        Live Network Monitoring

    </h1>

    <p class="text-center text-secondary">

        CNN + BiLSTM + Bahdanau Attention

    </p>

    <div class="row mt-5 g-4">

        <div class="col-lg-3">

            <div class="stat-card">

                <i class="fas fa-network-wired"></i>

                <h2 id="packetCount">

                    0

                </h2>

                <p>

                    Captured Packets

                </p>

            </div>

        </div>

        <div class="col-lg-3">

            <div class="stat-card">

                <i class="fas fa-check-circle text-success"></i>

                <h2 id="benignCount">

                    0

                </h2>

                <p>

                    Benign

                </p>

            </div>

        </div>

        <div class="col-lg-3">

            <div class="stat-card">

                <i class="fas fa-bug text-danger"></i>

                <h2 id="attackCount">

                    0

                </h2>

                <p>

                    Attacks

                </p>

            </div>

        </div>

        <div class="col-lg-3">

            <div class="stat-card">

                <i class="fas fa-circle text-success"></i>

                <h2>

                    LIVE

                </h2>

                <p>

                    Status

                </p>

            </div>

        </div>

    </div>

    <div class="info-card mt-5">

        <h3>

            Live Detection Feed

        </h3>

        <div class="table-responsive">

            <table class="table table-dark table-hover">

                <thead>

                    <tr>

                        <th>Time</th>

                        <th>Source</th>

                        <th>Destination</th>

                        <th>Prediction</th>

                        <th>Confidence</th>

                    </tr>

                </thead>

                <tbody id="liveTable">

                </tbody>

            </table>

        </div>

    </div>

    <div class="text-center mt-5">

        <a

            href="/"

            class="btn btn-primary btn-lg">

            <i class="fas fa-home"></i>

            Back Home

        </a>

    </div>

</div>

<footer class="footer">

    <div class="container">

        <hr>

        <h5>

            AI Powered Real-Time Network Intrusion Detection System

        </h5>

        <p>

            Live Monitoring Dashboard

        </p>

    </div>

</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>

    let lastFirstPacket = "";
    
    async function updateDashboard() {
    
        try {
    
            const response = await fetch("/live-packets");
    
            const data = await response.json();
    
            if (!Array.isArray(data)) return;
    
            const table = document.getElementById("liveTable");
    
            const packetCount = document.getElementById("packetCount");
            const benignCount = document.getElementById("benignCount");
            const attackCount = document.getElementById("attackCount");
    
            let benign = 0;
            let attacks = 0;
    
            packetCount.innerText = data.length;
    
            // Detect whether first packet changed
            const currentFirst =
                data.length > 0
                    ? data[0].source_ip +
                      data[0].source_port +
                      data[0].destination_ip +
                      data[0].destination_port
                    : "";
    
            if (currentFirst === lastFirstPacket)
                return;
    
            lastFirstPacket = currentFirst;
    
            table.innerHTML = "";
    
            data.forEach(result => {
    
                if (result.label === "BENIGN")
                    benign++;
                else
                    attacks++;
    
                const row = table.insertRow();
    
                row.insertCell().innerText =
                    new Date().toLocaleTimeString();
    
                row.insertCell().innerText =
                    `${result.source_ip}:${result.source_port}`;
    
                row.insertCell().innerText =
                    `${result.destination_ip}:${result.destination_port}`;
    
                const predictionCell = row.insertCell();
    
                predictionCell.innerHTML =
                    result.label === "BENIGN"
                        ? `<span class="badge bg-success">${result.label}</span>`
                        : `<span class="badge bg-danger">${result.label}</span>`;
    
                row.insertCell().innerText =
                    `${Number(result.confidence).toFixed(2)}%`;
    
            });
    
            benignCount.innerText = benign;
            attackCount.innerText = attacks;
    
        }
    
        catch (err) {
    
            console.error(err);
    
        }
    
    }
    
    updateDashboard();
    
    setInterval(updateDashboard, 1000);
    
    </script>
<script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>

</html>
